[project]
name = "app"
version = "0.0.0"
license = "Apache-2.0"
description = ""
authors = [
    { name = "CU Devs Collective", email = "team@centraluniversity.dev" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "httpx2>=2.12,<3",
    "loguru>=0.7,<1",
    "maxapi==1.2.2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
    "openapi-spec-validator==0.9.0",
    "pre-commit==4.6.2",
    "pyright==1.1.411",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[project.scripts]
api = "app.api.__main__:main"
bot = "app.bot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # style errors
    "F",   # invalid or unused Python constructs
    "I",   # import ordering
    "UP",  # modernization for supported Python versions
    "B",   # likely bugs
    "SIM", # unnecessary complexity
    "RUF", # Ruff-specific correctness rules
]

[tool.ruff.lint.isort]
lines-after-imports = 2
