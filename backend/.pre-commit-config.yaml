repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]

      - id: check-openapi
        name: check generated OpenAPI document
        entry: uv run python tools/generate_openapi.py --check
        language: system
        pass_filenames: false
        always_run: true
