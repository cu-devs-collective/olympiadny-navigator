# Replace api.baseUrl with your deployed HTTPS URL before submission.
# Requires APP_DEMO_ENABLED=true. Credentials are created per run, never embedded.
schemaVersion: '1.0'
solution:
  name: Олимпиадный маршрут
api:
  baseUrl: https://your-host.example/api
  openapi: ./backend/spec/openapi.yaml
  defaultHeaders:
    Accept: application/json
checks:
- id: health
  name: Готовность API
  method: GET
  path: /v1/healthz/ready
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - data
  timeoutMs: 5000
  repeatable: true
- id: catalog
  name: Программы и олимпиады с источниками
  method: GET
  path: /v1/catalog
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - programs
    - olympiads
  timeoutMs: 5000
  repeatable: true
- id: login
  name: Создать изолированного демонстрационного пользователя
  method: POST
  path: /v1/auth/demo
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - token
    - user
  timeoutMs: 5000
  repeatable: false
  extract:
    sessionToken: $.token
- id: profile
  name: Сохранить цели и настройки
  method: PUT
  path: /v1/me
  role: student
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - profile
  timeoutMs: 5000
  repeatable: true
  dependsOn:
  - login
  request:
    headers: &id001
      Authorization: Bearer ${sessionToken}
      Content-Type: application/json
    body:
      grade: 10
      admission_year: 2028
      program_ids:
      - hse-pmi
      subjects:
      - math
      consent: true
      notifications_enabled: true
      timezone: Europe/Moscow
      quiet_start: 0
      quiet_end: 0
- id: add-track
  name: Добавить олимпиаду в трек
  method: PUT
  path: /v1/track/{olympiad_id}
  role: student
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - items
  timeoutMs: 5000
  repeatable: true
  dependsOn:
  - profile
  request:
    headers: *id001
    path:
      olympiad_id: vsosh-math
- id: event
  name: Создать явно тестовое напоминание
  method: POST
  path: /v1/demo/events
  role: student
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - id
    - is_demo
    - state
  timeoutMs: 5000
  repeatable: false
  dependsOn:
  - add-track
  request:
    headers: *id001
    body:
      olympiad_id: vsosh-math
      kind: registration
  extract:
    notificationId: $.id
- id: action
  name: Отметить регистрацию из уведомления
  method: POST
  path: /v1/notifications/{notification_id}/actions
  role: student
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - ok
  timeoutMs: 5000
  repeatable: false
  dependsOn:
  - event
  request:
    headers: *id001
    body:
      action: registered
    path:
      notification_id: ${notificationId}
- id: read-track
  name: Проверить обновлённый трек
  method: GET
  path: /v1/track
  role: student
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - items
    bodySchema:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - status
            properties:
              status:
                const: registered
  timeoutMs: 5000
  repeatable: true
  dependsOn:
  - action
  request:
    headers: *id001
cleanup:
- id: delete-demo-profile
  method: DELETE
  path: /v1/me
  role: student
  request:
    headers: *id001
  expected:
    statusCodes:
    - 200
    - 401
  timeoutMs: 5000
